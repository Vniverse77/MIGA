[package]
name = "miga"
description = "MIGA terminal client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "miga"
path = "src/main.rs"

[dependencies]
miga-core = { path = "../miga-core" }
miga-client = { path = "../miga-client" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
tokio = { version = "1", features = ["rt", "time", "macros", "io-std", "io-util", "sync"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = { version = "0.2", default-features = false }
unicode-segmentation = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
jiff = { version = "0.2.46", default-features = false, features = ["std", "tz-system"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1.0.154"
