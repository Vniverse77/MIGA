[package]
name = "miga-client"
description = "MIGA relay client and file store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
miga-core = { path = "../miga-core" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tungstenite = { version = "0.28", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
