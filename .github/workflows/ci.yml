name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        working-directory: web
        run: deno install
      - name: Type check
        working-directory: web
        run: deno task check
      - name: Build
        working-directory: web
        run: deno task build

  relay:
    name: relay (vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Vet
        working-directory: relay
        run: go vet ./...
      - name: Test
        working-directory: relay
        run: go test ./...

  vectors:
    name: protocol vectors are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install web dependencies
        working-directory: web
        run: deno install
      - name: Regenerate vectors
        working-directory: web
        run: deno task vectors
      - name: Vectors must not change
        run: git diff --exit-code -- protocol/test-vectors
      - name: Self-check (decrypt every vector)
        working-directory: web
        run: deno task vectors:check

  cli:
    name: cli (fmt + clippy + test + release size)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test (includes every protocol vector)
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release
      - name: Binary size
        run: |
          size=$(stat -c %s target/release/miga)
          echo "miga release binary: $size bytes"
          echo "### miga release binary: $((size / 1024)) KiB" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -lt 8388608
