name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        working-directory: web
        run: deno install
      - name: Type check
        working-directory: web
        run: deno task check
      - name: Build
        working-directory: web
        run: deno task build

  relay:
    name: relay (vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Vet
        working-directory: relay
        run: go vet ./...
      - name: Test
        working-directory: relay
        run: go test ./...

  vectors:
    name: protocol vectors are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install web dependencies
        working-directory: web
        run: deno install
      - name: Regenerate vectors
        working-directory: web
        run: deno task vectors
      - name: Vectors must not change
        run: git diff --exit-code -- protocol/test-vectors
      - name: Self-check (decrypt every vector)
        working-directory: web
        run: deno task vectors:check

