<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#070b14" />
		<script>
			// Apply the saved theme before first paint (dark unless the user chose light or system).
			try {
				var t = localStorage.getItem('miga.theme');
				var light = t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
				document.documentElement.dataset.theme = light ? 'light' : 'dark';
				document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#ffffff' : '#0d1525');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
